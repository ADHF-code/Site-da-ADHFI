"$schema" = "https://open-api.netlify.com/netlify.schema.json"
[build]
  command = "node build.js"
  publish = "dist"


[[redirects]]
  from = "/associados"
  to = "https://cfi-lab.netlify.app/associados.html"
  status = 302
  force = true

[[redirects]]
  from = "/atividades/"
  to = "/agenda/"
  status = 301
  force = true

[[headers]]
  for = "/agenda/events.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300, must-revalidate"
